
{% extends "base.html" %}

{% block contenu %}

<div class="page-header">
    <h2>Enregistrer un nouvel emprunt</h2>
    <p>Associez un adhérent à un livre disponible.</p>
</div>

<div class="form-container">

    <form method="POST" class="modern-form">

        <div class="form-group">

            <label for="id_adherent">
                Choisir un adhérent
            </label>

            <select name="id_adherent" id="id_adherent" required>

                <option value="">-- Sélectionner un adhérent --</option>

                {% for adherent in adherents %}

                <option value="{{ adherent[0] }}">
                    {{ adherent[1] }} {{ adherent[2] }}
                </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-group">

            <label for="id_livre">
                Choisir un livre disponible
            </label>

            <select name="id_livre" id="id_livre" required>

                <option value="">-- Sélectionner un livre --</option>

                {% for livre in livres %}

                    {% if livre[4] %}

                    <option value="{{ livre[0] }}">
                        {{ livre[1] }}
                    </option>

                    {% endif %}

                {% endfor %}

            </select>

        </div>

        <button type="submit" class="btn-add">
            Enregistrer l'emprunt
        </button>

    </form>

</div>

{% endblock %}
